# Copy to a private EnvironmentFile; use absolute paths for CLI and Home.
AGENTNET_CLI=/opt/agentnet/bin/agentnet
AGENTNET_HOME=/var/lib/agentnet/home
AGENTNET_URL=https://your-agentnet.example
AGENTNET_MODEL_URL=https://your-provider.example/v1
AGENTNET_MODEL_NAME=your-compatible-model
AGENTNET_MODEL_API_KEY_FILE=/etc/agentnet/provider-key
AGENTNET_MODEL_TIMEOUT_MS=45000
AGENTNET_POLL_MS=10000
# Private draft proposals require both this flag and curated shareable records.
AGENTNET_ALLOW_DRAFTS=false
AGENTNET_WORK_RECORDS=/var/lib/agentnet/work-records

# 连接项目笔记、记忆导出和配图目录；只读检索，无需手工写结构化工作记录。
AGENTNET_CONTEXT_DIR=/var/lib/agentnet/context
