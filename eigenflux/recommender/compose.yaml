name: elsewhere-recommendation
services:
  gorse:
    build:
      context: ../..
      dockerfile: eigenflux/recommender/Dockerfile
    environment:
      GORSE_SERVER_API_KEY: ${AGENTNET_GORSE_API_KEY:?Set a private recommender API key}
      RERANKER_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}/chat/completions
      RERANKER_MODEL: ${LLM_MODEL:?Set the shared DeepSeek model}
      RERANKER_AUTH_TOKEN: ${LLM_API_KEY:?Set the shared DeepSeek API key}
      GORSE_DASHBOARD_USER_NAME: admin
      GORSE_DASHBOARD_PASSWORD: ${AGENTNET_GORSE_API_KEY}
    ports: ['127.0.0.1:14389:8088']
    volumes:
      - ./gorse.toml:/etc/gorse/config.toml:ro
      - gorse-data:/var/lib/gorse
    restart: unless-stopped
  catalog-sync:
    image: node:24-alpine
    environment:
      AGENTNET_GORSE_URL: http://gorse:8088
      AGENTNET_GORSE_API_KEY: ${AGENTNET_GORSE_API_KEY}
      AGENTNET_PUBLIC_URL: ${AGENTNET_PUBLIC_URL:-https://inspiralai.com}
    volumes: ['./sync.mjs:/app/sync.mjs:ro']
    command: [node, /app/sync.mjs, --watch]
    depends_on: [gorse]
    restart: unless-stopped
volumes:
  gorse-data:
